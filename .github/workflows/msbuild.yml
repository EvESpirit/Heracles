name: MSBuild

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  # Path to the solution file relative to the root of the project.
  SOLUTION_FILE_PATH: .

permissions: # For creating a release
  contents: write
  packages: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository and submodules
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v3

    - name: Restore NuGet packages
      working-directory: ${{ github.workspace }}
      run: nuget restore ${{ env.SOLUTION_FILE_PATH }}

    - name: Stage vcpkg
      working-directory: ${{ github.workspace }}
      run: . .\external\vcpkg\scripts\bootstrap.ps1

    - name: Build
      working-directory: ${{ github.workspace }}
      run: msbuild /p:Configuration=Release /p:PlatformTarget=x64 /p:OutDir=${{ github.workspace }}\output\ ${{ env.SOLUTION_FILE_PATH }}

    - name: Zip
      working-directory: ${{ github.workspace }}
      run: Compress-Archive -Path "${{ github.workspace }}\output\*.*" -DestinationPath "${{ github.workspace }}\heracles.zip"

    - name: Publish Release
      uses: ncipollo/release-action@v1
      with:
        tag: v0.0.1
        allowUpdates: true
        artifactErrorsFailBuild: true
        body: "CI release for main branch."
        commit: ${{ github.sha }}
        generateReleaseNotes: true
        removeArtifacts: true
        replacesArtifacts: true
        artifacts: "heracles.zip"
