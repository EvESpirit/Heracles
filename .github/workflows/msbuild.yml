name: MSBuild

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  SOLUTION_FILE_PATH: .

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v3

    - name: Restore NuGet packages
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: nuget restore ${{env.SOLUTION_FILE_PATH}}

    - name: Stage vcpkg
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: . .\external\vcpkg\scripts\bootstrap.ps1

    - name: Build
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: msbuild /p:Configuration=Release /p:PlatformTarget=x64 /p:OutDir=${{env.GITHUB_WORKSPACE}}\output ${{env.SOLUTION_FILE_PATH}}

    - name: Zip
      run: Compress-Archive -Path ${{env.GITHUB_WORKSPACE}}\output\*.* -DestinationPath ${{env.GITHUB_WORKSPACE}}\heracles-release.zip

    - uses: ncipollo/release-action@v1
      with:
        tag: v0.0.0x
        allowUpdates: true
        artifactErrorsFailBuild: true
        body: "CI release for main branch."
        commit: ${{ env.GITHUB_SHA }}
        generateReleaseNotes: true
        removeArtifacts: true
        replacesArtifacts: true
        artifacts: ${{env.GITHUB_WORKSPACE}}\heracles.zip
